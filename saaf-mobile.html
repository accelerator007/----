<style>
  body { background: #2a2218; }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .phone-shell {
    width: 390px; height: 800px;
    background: #1f1a14;
    border-radius: 48px;
    padding: 12px;
    box-shadow: 0 0 0 2px #3a3225, 0 30px 80px rgba(0,0,0,.5);
    position: relative;
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: var(--bg);
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .phone-notch {
    position: absolute; top: 16px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 28px;
    background: #1f1a14; border-radius: 999px;
    z-index: 100;
  }
  .status-bar {
    position: absolute; top: 18px; left: 0; right: 0;
    padding: 0 30px; display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-weight: 600; font-size: 13px;
    z-index: 99; color: var(--ink);
  }
  .status-bar .right { display:flex; gap: 5px; align-items: center; }
  @media (max-width: 480px) {
    body { background: var(--bg); }
    .stage { padding: 0; min-height: 100vh; align-items: stretch; }
    .phone-shell { width: 100%; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; }
    .phone-screen { border-radius: 0; }
    .phone-notch { display: none; }
    .status-bar { display: none; }
  }
  .scroll-body { flex: 1; overflow-y: auto; padding: 70px 0 90px; -webkit-overflow-scrolling: touch; }
  @media (max-width: 480px) { .scroll-body { padding-top: 14px; } }

  .m-page { padding: 16px 18px; }
  .m-greeting { font-size: 13px; color: var(--ink-3); }
  .m-name { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 2px 0 0; }
  .m-h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .m-h2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; }

  .trap-card {
    background: linear-gradient(160deg, #2a2218 0%, #1f1a14 100%);
    color: #f0e6cf;
    border-radius: 22px;
    padding: 20px;
    position: relative; overflow: hidden;
    box-shadow: var(--sh-2);
  }
  .trap-card.danger { background: linear-gradient(160deg, #7d2e14 0%, #4a1a0a 100%); }
  .trap-card.warn   { background: linear-gradient(160deg, #8a5824 0%, #4a2e10 100%); }
  .trap-card .live { display:flex; align-items:center; gap:6px; font-family: var(--font-mono); font-size: 11px; color: #d4a35a; }
  .trap-card .live .dot { width:6px; height:6px; border-radius:50%; background:#90b86c; box-shadow: 0 0 0 4px rgba(144,184,108,.2); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .big-num { font-family: var(--font-display); font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -.03em; margin: 16px 0 6px; }
  .big-num .unit { font-size: 16px; color: #a89776; font-family: var(--font-sans); margin-inline-start: 8px; font-weight: 500; }

  .trap-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(233,223,201,.12); }
  .trap-meta .item .l { font-size: 10px; color: #a89776; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .1em; }
  .trap-meta .item .v { font-size: 14px; color: #f0e6cf; margin-top: 3px; font-weight: 500; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .stat-tile .l { font-size: 10px; color: var(--ink-3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .1em; }
  .stat-tile .v { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin-top: 2px; }

  .recommend {
    background: var(--accent-soft);
    border: 1px solid #b9cf9a;
    border-radius: 16px;
    padding: 16px;
    display: flex; gap: 12px;
  }
  .recommend.danger { background: var(--danger-soft); border-color: #e89d80; }
  .recommend.warn { background: var(--warn-soft); border-color: #e8c182; }
  .recommend .icn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--ok); color: #fff;
    display: grid; place-items: center; flex: none;
  }
  .recommend.danger .icn { background: var(--danger); }
  .recommend.warn .icn { background: var(--warn); }

  .sect-head { display:flex; justify-content: space-between; align-items: end; margin: 22px 0 10px; }
  .sect-head h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
  .sect-head a { font-size: 12px; color: var(--brand); }

  .alert-row {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 10px;
  }
  .alert-row .severity { width: 4px; align-self: stretch; border-radius: 2px; }
  .alert-row.critical .severity { background: var(--danger); }
  .alert-row.warn .severity { background: var(--warn); }
  .alert-row.info .severity { background: var(--info); }

  /* Bottom nav */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,.92); backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 8px 6px 22px;
    z-index: 50;
  }
  @media (max-width: 480px) { .bottom-nav { padding-bottom: max(22px, env(safe-area-inset-bottom)); } }
  .bnav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 6px 4px; border-radius: 10px;
    color: var(--ink-4); cursor: pointer;
    font-size: 10px; font-weight: 500;
    transition: color .12s;
  }
  .bnav-item.active { color: var(--brand); }
  .bnav-fab {
    background: var(--brand); color: #fff8e8;
    width: 50px; height: 50px; border-radius: 16px;
    display: grid; place-items: center;
    margin-top: -22px; box-shadow: 0 8px 20px rgba(111,67,24,.3);
  }

  /* Top bar inside screen */
  .m-topbar {
    position: absolute; top: 50px; left: 0; right: 0;
    padding: 8px 18px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(250,246,239,.85); backdrop-filter: blur(10px);
    z-index: 40;
  }
  @media (max-width: 480px) { .m-topbar { top: 0; padding-top: max(12px, env(safe-area-inset-top)); } }
  .m-topbar h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; }
  .m-topbar .icon-btn { width: 36px; height: 36px; }

  /* Page transition */
  .m-page-anim { animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

  /* Lists */
  .list-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .list-row { padding: 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }

  /* Tech card */
  .tech-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: flex; gap: 14px; align-items: center;
  }
  .tech-card .ph {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #8a5824, #5a7a3f);
    color: #fff; display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 600; font-size: 22px;
    flex: none;
  }

  .stars { color: #d4a35a; font-size: 12px; }

  /* Plan card */
  .plan-card {
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .plan-card.selected { border-color: var(--brand); background: var(--bg-2); }

  /* Tab segments */
  .seg-mobile {
    display: flex; padding: 3px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 10px; gap: 2px;
  }
  .seg-mobile button {
    flex: 1; padding: 7px; font-size: 12px; font-weight: 500;
    background: transparent; border: none; border-radius: 7px;
    color: var(--ink-3); cursor: pointer;
  }
  .seg-mobile button.active { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
</style>
